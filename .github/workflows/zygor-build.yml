# Darrell's fork: builds the Windows installer and the addon zip from the zygor branch, as artifacts
# to download from the run's page. No release, no CurseForge upload, no secrets.
name: Zygor build

on:
  workflow_dispatch:
  push:
    branches: [zygor]

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      # The app updates itself from the releases of the repository it names, and a build from the
      # sources is version 0.0.0: left as is, it would find Catubba's newest release at its first
      # start and put it in place of this one. So this build names the fork, which has no releases,
      # and the app opens as it is.
      - run: npx electron-vite build
      - run: npx electron-builder --win nsis --publish never -c.extraMetadata.version="0.17.0-zygor.${{ github.run_number }}" -c.publish.owner=Dewdad48
      - uses: actions/upload-artifact@v4
        with:
          name: Twinmap-Zygor-Setup
          path: app/dist/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: TwinmapForever-addon
          path: addon/TwinmapForever
